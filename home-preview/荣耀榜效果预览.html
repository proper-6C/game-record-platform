<html lang="zh-CN">
<head>

<title>荣耀榜 · 效果预览</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0612'/%3E%3Ctext x='32' y='44' font-size='30' text-anchor='middle' fill='%23c084fc' font-weight='bold'%3EGR%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0a0612; --card: rgba(21, 16, 34, .78); --line: rgba(192, 132, 252, .18);
    --purple: #c084fc; --cyan: #22d3ee; --gold: #fbbf24; --silver: #cbd5e1; --bronze: #d97706;
    --text: #f3eefc; --sub: #a99bc9;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    color: var(--text); background: var(--bg); min-height: 100vh;
    background-image:
      radial-gradient(1200px 500px at 15% -5%, rgba(192, 132, 252, .16), transparent 60%),
      radial-gradient(900px 420px at 90% 0%, rgba(34, 211, 238, .12), transparent 55%);
    overflow-x: hidden;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

  /* ===== 顶部导航 ===== */
  nav {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 26px; background: rgba(10, 6, 18, .82); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .logo { display: flex; align-items: center; gap: 11px; cursor: pointer; }
  .mark {
    width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center;
    font-size: 14px; font-weight: 900; color: #0a0612;
    background: linear-gradient(135deg, var(--purple), var(--cyan));
    box-shadow: 0 0 14px rgba(192, 132, 252, .55);
  }
  .logo b {
    font-size: 16px; font-weight: 800;
    background: linear-gradient(90deg, #f3eefc, var(--purple) 60%, var(--cyan));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    line-height: 1.15; display: flex; flex-direction: column;
  }
  .logo b small { font-size: 10px; font-weight: 400; letter-spacing: .14em; color: #6f6391; margin-top: 2px; }
  .nav-links { display: flex; gap: 4px; align-items: center; }
  .nav-links a {
    color: var(--sub); text-decoration: none; font-size: 14px; padding: 8px 14px; border-radius: 10px;
    transition: color .2s, background .2s, text-shadow .2s; cursor: pointer;
  }
  .nav-links a:hover, .nav-links a.on { color: var(--purple); text-shadow: 0 0 12px rgba(192,132,252,.7); background: rgba(192,132,252,.08); }

  /* ===== 页头 ===== */
  .page-head { padding: 46px 0 10px; text-align: center; }
  .page-head .kicker {
    font-size: 12px; font-weight: 700; letter-spacing: .22em; color: var(--sub); margin-bottom: 10px;
  }
  .page-head h1 {
    font-size: 40px; font-weight: 900; letter-spacing: .06em;
    background: linear-gradient(90deg, #f3eefc, var(--purple) 55%, var(--cyan));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 40px rgba(192, 132, 252, .25);
  }
  .page-head p { margin-top: 12px; color: var(--sub); font-size: 14px; }

  /* ===== 榜单切换 ===== */
  .tabs { display: flex; justify-content: center; gap: 10px; margin: 26px 0 8px; }
  .tab {
    padding: 9px 26px; border-radius: 999px; cursor: pointer; user-select: none;
    color: var(--sub); font-size: 14px; font-weight: 600;
    border: 1px solid var(--line); background: var(--card);
    transition: all .25s;
  }
  .tab:hover { color: var(--purple); border-color: rgba(192,132,252,.5); }
  .tab.on {
    color: #0a0612; font-weight: 800;
    background: linear-gradient(135deg, var(--purple), var(--cyan));
    border-color: transparent; box-shadow: 0 0 22px rgba(192, 132, 252, .4);
  }

  /* ===== 领奖台 ===== */
  .podium { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; align-items: end; margin: 30px 0 8px; }
  .p-card {
    text-align: center; padding: 26px 14px 20px; border-radius: 18px;
    background: var(--card); border: 1px solid var(--line); position: relative; overflow: hidden;
    transition: transform .3s, box-shadow .3s;
  }
  .p-card:hover { transform: translateY(-6px); }
  .p-card.first {
    order: 2; padding-top: 34px;
    background: linear-gradient(180deg, rgba(251, 191, 36, .12), var(--card) 70%);
    border-color: rgba(251, 191, 36, .4); box-shadow: 0 0 34px rgba(251, 191, 36, .14);
  }
  .p-card.second { order: 1; }
  .p-card.third { order: 3; }
  .p-card .crown { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); font-size: 30px; filter: drop-shadow(0 0 12px rgba(251,191,36,.6)); }
  .p-card .rank-no { font-size: 13px; font-weight: 900; color: var(--sub); letter-spacing: .1em; margin-bottom: 10px; }
  .p-card.first .rank-no { color: var(--gold); text-shadow: 0 0 12px rgba(251,191,36,.6); }
  .p-avatar {
    width: 76px; height: 76px; margin: 0 auto 12px; border-radius: 50%;
    display: grid; place-items: center; font-size: 30px; font-weight: 900; color: #0a0612;
    box-shadow: 0 0 0 3px rgba(192, 132, 252, .3), 0 0 24px rgba(192, 132, 252, .35);
  }
  .p-card.first .p-avatar { width: 92px; height: 92px; font-size: 36px; box-shadow: 0 0 0 3px rgba(251,191,36,.55), 0 0 34px rgba(251,191,36,.5); }
  .p-name { font-size: 17px; font-weight: 800; }
  .p-card.first .p-name { font-size: 20px; background: linear-gradient(90deg, #fde68a, var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .p-stat { margin-top: 8px; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
  .p-stat b { font-size: 15px; color: var(--purple); }
  .p-card.first .p-stat b { color: var(--gold); }
  .p-badge {
    position: absolute; top: 12px; right: 12px; font-size: 11px; padding: 3px 9px; border-radius: 999px;
    background: rgba(34, 211, 238, .12); color: var(--cyan); border: 1px solid rgba(34,211,238,.35);
  }

  /* ===== 排行列表 ===== */
  .board {
    margin-top: 18px; border-radius: 18px; overflow: hidden;
    background: var(--card); border: 1px solid var(--line);
  }
  .board-head {
    display: grid; grid-template-columns: 64px 1fr 120px 140px; gap: 12px;
    padding: 14px 22px; font-size: 12.5px; color: var(--sub); letter-spacing: .08em;
    border-bottom: 1px solid var(--line);
  }
  .row {
    display: grid; grid-template-columns: 64px 1fr 120px 140px; gap: 12px; align-items: center;
    padding: 13px 22px; transition: background .2s; cursor: default;
  }
  .row:hover { background: rgba(192, 132, 252, .06); }
  .row + .row { border-top: 1px solid rgba(192, 132, 252, .08); }
  .row .no { font-size: 17px; font-weight: 900; color: var(--sub); font-variant-numeric: tabular-nums; }
  .row .no.top { color: var(--gold); text-shadow: 0 0 10px rgba(251,191,36,.5); }
  .player { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .player .av {
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center;
    font-weight: 800; color: #0a0612; font-size: 15px;
  }
  .player .nm { min-width: 0; }
  .player .nm b { display: block; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player .nm span { font-size: 12px; color: var(--sub); }
  .bar-cell { display: flex; align-items: center; gap: 10px; }
  .bar { flex: 1; height: 8px; border-radius: 99px; background: rgba(192, 132, 252, .12); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--purple), var(--cyan)); box-shadow: 0 0 10px rgba(192,132,252,.5); transition: width .8s cubic-bezier(.22,1,.36,1); }
  .bar-cell em { font-style: normal; font-size: 12.5px; color: var(--sub); width: 58px; text-align: right; font-variant-numeric: tabular-nums; }

  /* ===== 游戏榜 ===== */
  .game-board { margin-top: 18px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); padding: 20px 22px; }
  .game-board h3 { font-size: 15px; font-weight: 800; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .game-board h3::before { content: ""; width: 4px; height: 16px; border-radius: 99px; background: linear-gradient(180deg, var(--purple), var(--cyan)); box-shadow: 0 0 10px rgba(192,132,252,.6); }
  .game-row { display: grid; grid-template-columns: 40px 1fr 110px; gap: 12px; align-items: center; padding: 9px 0; }
  .game-row .g-no { font-weight: 900; color: var(--sub); font-size: 15px; font-variant-numeric: tabular-nums; }
  .game-row .g-no.g1 { color: var(--gold); }
  .game-row .g-name { font-size: 14.5px; font-weight: 600; }
  .game-row .g-bar { height: 7px; border-radius: 99px; background: rgba(34,211,238,.1); overflow: hidden; }
  .game-row .g-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--cyan), var(--purple)); box-shadow: 0 0 10px rgba(34,211,238,.45); transition: width .8s cubic-bezier(.22,1,.36,1); }
  .game-row .g-cnt { text-align: right; font-size: 12.5px; color: var(--sub); font-variant-numeric: tabular-nums; }

  footer { text-align: center; padding: 34px 0 26px; color: #6f6391; font-size: 12.5px; }
  .demo-tip {
    display: inline-block; margin-top: 10px; padding: 4px 12px; border-radius: 999px;
    font-size: 12px; color: var(--cyan); border: 1px solid rgba(34,211,238,.3); background: rgba(34,211,238,.06);
  }
  /* ===== 通知铃铛 ===== */
  .bell {
    position: relative; width: 38px; height: 38px; margin-left: 6px; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer; color: var(--sub);
    background: transparent; border: 1px solid transparent;
    transition: color .2s, background .2s, box-shadow .2s;
  }
  .bell:hover { color: var(--cyan); background: rgba(34,211,238,.08); box-shadow: 0 0 14px rgba(34,211,238,.2); }
  .bell-badge {
    position: absolute; top: 1px; right: 0; min-width: 17px; height: 17px; padding: 0 4px;
    border-radius: 999px; background: #ef4444; color: #fff; font-size: 11px; font-weight: 800;
    display: grid; place-items: center; font-variant-numeric: tabular-nums;
    box-shadow: 0 0 0 2px rgba(10,6,18,.9), 0 0 10px rgba(239,68,68,.6);
  }
  .notif-panel {
    position: fixed; top: 66px; right: 20px; width: 320px; z-index: 80;
    border-radius: 14px; background: rgba(18,13,30,.95); border: 1px solid rgba(192,132,252,.3);
    box-shadow: 0 0 0 1px rgba(192,132,252,.08), 0 20px 50px rgba(0,0,0,.5);
    backdrop-filter: blur(10px); overflow: hidden; display: none;
  }
  .notif-panel.open { display: block; animation: npIn .25s cubic-bezier(.22,1,.36,1); }
  @keyframes npIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  .np-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 16px; font-size: 14px; font-weight: 800; color: #f3eefc;
    border-bottom: 1px solid rgba(192,132,252,.14);
  }
  .np-all {
    background: none; border: 0; cursor: pointer; font-size: 12px; color: var(--cyan);
    padding: 4px 8px; border-radius: 999px; transition: background .2s;
  }
  .np-all:hover { background: rgba(34,211,238,.1); }
  .np-item {
    display: flex; gap: 11px; align-items: flex-start; padding: 12px 16px;
    border-bottom: 1px solid rgba(192,132,252,.08); transition: background .2s; cursor: default;
  }
  .np-item:hover { background: rgba(192,132,252,.06); }
  .np-ico {
    width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0; display: grid; place-items: center;
    color: #fb7185; background: rgba(251,113,133,.12);
  }
  .np-item:nth-child(3) .np-ico { color: var(--cyan); background: rgba(34,211,238,.1); }
  .np-txt { font-size: 13px; color: #d7ccef; line-height: 1.5; }
  .np-txt b { color: #f3eefc; }
  .np-time { display: block; margin-top: 3px; font-size: 11.5px; color: #6f6391; }
  .np-empty { padding: 30px 16px; text-align: center; color: #6f6391; font-size: 13px; }
  .fade-in { animation: fadeIn .45s cubic-bezier(.22,1,.36,1) both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  @media (max-width: 760px) {
    .podium { grid-template-columns: 1fr; }
    .p-card.first { order: -1; }
    .board-head { display: none; }
    .row { grid-template-columns: 44px 1fr 92px; }
    .row .bar-cell { display: none; }
    .page-head h1 { font-size: 30px; }
  }
</style>
</head>

        { name: "英雄联盟", cnt: 3204 }, { name: "三角洲行动", cnt: 2876 }, { name: "CS2", cnt: 2410 },
        { name: "无畏契约", cnt: 1960 }, { name: "永劫无间", cnt: 1308 }
      ]
    }
  };

  const KEYS = ["week", "month", "total"];
  let cur = "week";

  function renderTabs() {
    document.getElementById("tabs").innerHTML = KEYS.map(k =>
      `<button class="tab ${k === cur ? "on" : ""}" data-k="${k}">${DATA[k].name}</button>`).join("");
    document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
      cur = b.dataset.k;
      render();
    }));
  }

  function render() {
    const d = DATA[cur];
    renderTabs();

    /* 领奖台 */
    const orderCls = { 1: "first", 2: "second", 3: "third" };
    document.getElementById("podium").innerHTML = d.podium.map(p => `
      <div class="p-card ${orderCls[p.rank]}">
        ${p.rank === 1 ? '<div class="crown">&#x1F451;</div>' : ""}
        <div class="rank-no">NO.${p.rank}</div>
        <div class="p-avatar" style="background:${p.avatar}">${p.name[0]}</div>
        <div class="p-name">${p.name}</div>
        ${p.badge ? `<span class="p-badge">${p.badge}</span>` : ""}
        <div class="p-stat"><b>${p.likes.toLocaleString()}</b> 获赞 · ${p.records} 局</div>
      </div>`).join("");

    /* 排行列表 */
    const max = d.rows[0].likes;
    document.getElementById("list").innerHTML = d.rows.map(r => `
      <div class="row fade-in">
        <span class="no ${r.rank <= 3 ? "top" : ""}">${r.rank}</span>
        <div class="player">
          <span class="av" style="background:${r.avatar}">${r.name[0]}</span>
          <div class="nm"><b>${r.name}</b><span>${r.records} 局对局</span></div>
        </div>
        <div class="bar-cell">
          <div class="bar"><i style="width:${(r.likes / max * 100).toFixed(1)}%"></i></div>
          <em>${Math.round(r.likes / max * 100)}%</em>
        </div>
        <em style="text-align:right;font-style:normal;color:var(--sub);font-size:13px;font-variant-numeric:tabular-nums">${r.likes.toLocaleString()} / ${r.records}</em>
      </div>`).join("");

    /* 游戏榜 */
    const gmax = d.games[0].cnt;
    document.getElementById("games").innerHTML = d.games.map((g, i) => `
      <div class="game-row">
        <span class="g-no ${i === 0 ? "g1" : ""}">${String(i + 1).padStart(2, "0")}</span>
        <div class="g-bar"><i style="width:${(g.cnt / gmax * 100).toFixed(1)}%"></i></div>
        <span class="g-cnt">${g.name} · ${g.cnt.toLocaleString()} 局</span>
      </div>`).join("");
  }

  /* 通知铃铛：开关面板 / 全部已读 */
  function toggleNotif(e) {
    e.stopPropagation()
    document.getElementById("notifPanel").classList.toggle("open")
  }
  function markAllRead() {
    document.querySelectorAll(".notif-panel .np-item").forEach(n => (n.style.display = "none"))
    document.getElementById("bellBadge").style.display = "none"
    document.getElementById("npEmpty").style.display = "block"
    toast("已全部标记为已读")
  }
  document.addEventListener("click", () => document.getElementById("notifPanel").classList.remove("open"))

  function toast(msg) {
    let t = document.getElementById("toast");
    if (!t) { t = document.createElement("div"); t.id = "toast"; document.body.appendChild(t); }
    t.textContent = msg;
    t.style.cssText = "position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:rgba(21,16,34,.92);color:#f3eefc;border:1px solid rgba(192,132,252,.4);padding:10px 18px;border-radius:999px;font-size:13px;z-index:99;box-shadow:0 0 24px rgba(192,132,252,.3)";
    clearTimeout(t._tm);
    t._tm = setTimeout(() => (t.style.display = "none"), 1600);
    t.style.display = "block";
  }

  render();
</script>
</body>
</html>

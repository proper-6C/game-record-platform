<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>收藏夹 · 效果预览</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0612'/%3E%3Ctext x='32' y='44' font-size='30' text-anchor='middle' fill='%23c084fc' font-weight='bold'%3EGR%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0a0612; --card: rgba(21, 16, 34, .78); --line: rgba(192, 132, 252, .18);
    --purple: #c084fc; --cyan: #22d3ee; --gold: #fbbf24;
    --text: #f3eefc; --sub: #a99bc9;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    color: var(--text); background: var(--bg); min-height: 100vh;
    background-image:
      radial-gradient(1200px 500px at 15% -5%, rgba(192, 132, 252, .16), transparent 60%),
      radial-gradient(900px 420px at 90% 0%, rgba(34, 211, 238, .12), transparent 55%);
  }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 0 20px 40px; }

  nav {
    position: sticky; top: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between;
    padding: 14px 26px; background: rgba(10, 6, 18, .82); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line); margin-bottom: 26px;
  }
  .logo { display: flex; align-items: center; gap: 11px; cursor: pointer; }
  .mark {
    width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center;
    font-size: 14px; font-weight: 900; color: #0a0612;
    background: linear-gradient(135deg, var(--purple), var(--cyan));
    box-shadow: 0 0 14px rgba(192, 132, 252, .55);
  }
  .logo b {
    font-size: 16px; font-weight: 800; line-height: 1.15; display: flex; flex-direction: column;
    background: linear-gradient(90deg, #f3eefc, var(--purple) 60%, var(--cyan));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .logo b small { font-size: 10px; font-weight: 400; letter-spacing: .14em; color: #6f6391; margin-top: 2px; }
  .nav-links { display: flex; gap: 4px; }
  .nav-links a {
    color: var(--sub); text-decoration: none; font-size: 14px; padding: 8px 14px; border-radius: 10px; cursor: pointer;
    transition: color .2s, background .2s, text-shadow .2s;
  }
  .nav-links a:hover, .nav-links a.on { color: var(--purple); text-shadow: 0 0 12px rgba(192,132,252,.7); background: rgba(192,132,252,.08); }

  .page-head { padding: 30px 0 6px; text-align: center; }
  .page-head .kicker { font-size: 12px; font-weight: 700; letter-spacing: .22em; color: var(--sub); margin-bottom: 10px; }
  .page-head h1 {
    font-size: 36px; font-weight: 900; letter-spacing: .06em;
    background: linear-gradient(90deg, #f3eefc, var(--purple) 55%, var(--cyan));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .page-head p { margin-top: 12px; color: var(--sub); font-size: 14px; }

  /* 分区切换：全部对局 / 我的收藏 */
  .seg { display: flex; justify-content: center; gap: 10px; margin: 24px 0 18px; }
  .seg button {
    padding: 9px 26px; border-radius: 999px; cursor: pointer; font-size: 14px; font-weight: 600;
    color: var(--sub); background: var(--card); border: 1px solid var(--line); transition: all .25s;
  }
  .seg button:hover { color: var(--purple); border-color: rgba(192,132,252,.5); }
  .seg button.on {
    color: #0a0612; font-weight: 800;
    background: linear-gradient(135deg, var(--purple), var(--cyan)); border-color: transparent;
    box-shadow: 0 0 22px rgba(192,132,252,.4);
  }
  .seg button .cnt { opacity: .7; font-weight: 700; margin-left: 4px; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .card {
    position: relative; border-radius: 14px; overflow: hidden; cursor: pointer;
    background: var(--card); border: 1px solid var(--line);
    transition: transform .25s, box-shadow .25s, border-color .25s;
  }
  .card:hover { transform: translateY(-5px); box-shadow: 0 0 0 1px rgba(192,132,252,.35), 0 12px 28px rgba(139,92,246,.22); border-color: rgba(192,132,252,.4); }
  .cover { position: relative; aspect-ratio: 16/9; overflow: hidden; background: linear-gradient(135deg, #4c1d95, #0e7490); }
  .cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.18) 50%, transparent 70%); animation: shine 3.4s linear infinite; }
  @keyframes shine { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
  .cover .ph {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: rgba(243,238,252,.8); letter-spacing: .1em;
  }
  .cover .res {
    position: absolute; top: 8px; left: 8px; font-size: 11px; font-weight: 700;
    padding: 3px 9px; border-radius: 999px; background: rgba(52,211,153,.15); color: #34d399; border: 1px solid rgba(52,211,153,.4);
  }
  .cover .res.lose { background: rgba(251,113,133,.15); color: #fb7185; border-color: rgba(251,113,133,.4); }
  .star {
    position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer; z-index: 2;
    background: rgba(10, 6, 18, .55); border: 1px solid rgba(255,255,255,.15); backdrop-filter: blur(4px);
    transition: transform .2s, box-shadow .2s, background .2s;
  }
  .star:hover { transform: scale(1.15); }
  .star svg { width: 17px; height: 17px; fill: none; stroke: #e9d5ff; transition: all .2s; }
  .star.on { background: rgba(251,191,36,.18); border-color: rgba(251,191,36,.6); box-shadow: 0 0 14px rgba(251,191,36,.35); }
  .star.on svg { fill: var(--gold); stroke: var(--gold); filter: drop-shadow(0 0 6px rgba(251,191,36,.8)); animation: pop .35s cubic-bezier(.22,1,.36,1); }
  @keyframes pop { 0% { transform: scale(.4); } 60% { transform: scale(1.35); } 100% { transform: scale(1); } }
  .body { padding: 12px 14px 14px; }
  .name { font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tags { margin-top: 8px; display: flex; gap: 4px; flex-wrap: wrap; }
  .tags i {
    font-style: normal; font-size: 11px; padding: 2px 8px; border-radius: 6px;
    color: var(--cyan); border: 1px solid rgba(34,211,238,.3); background: rgba(34,211,238,.06);
  }
  .meta { margin-top: 10px; display: flex; gap: 14px; color: var(--sub); font-size: 12.5px; align-items: center; font-variant-numeric: tabular-nums; }
  .meta .author { display: flex; align-items: center; gap: 6px; }
  .meta .author .av { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 800; color: #0a0612; }
  .meta .likes { margin-left: auto; display: flex; align-items: center; gap: 4px; }

  .empty {
    grid-column: 1 / -1; padding: 60px 0; text-align: center; color: var(--sub);
    border: 1px dashed rgba(192,132,252,.3); border-radius: 16px; background: rgba(21,16,34,.4);
  }
  .empty b { display: block; font-size: 16px; color: var(--text); margin-bottom: 6px; }
  .empty span { font-size: 13px; }

  footer { text-align: center; padding: 34px 0 10px; color: #6f6391; font-size: 12.5px; }
  .demo-tip {
    display: inline-block; margin-top: 10px; padding: 4px 12px; border-radius: 999px;
    font-size: 12px; color: var(--cyan); border: 1px solid rgba(34,211,238,.3); background: rgba(34,211,238,.06);
  }
  /* ===== 通知铃铛 ===== */
  .bell {
    position: relative; width: 38px; height: 38px; margin-left: 6px; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer; color: var(--sub);
    background: transparent; border: 1px solid transparent;
    transition: color .2s, background .2s, box-shadow .2s;
  }
  .bell:hover { color: var(--cyan); background: rgba(34,211,238,.08); box-shadow: 0 0 14px rgba(34,211,238,.2); }
  .bell-badge {
    position: absolute; top: 1px; right: 0; min-width: 17px; height: 17px; padding: 0 4px;
    border-radius: 999px; background: #ef4444; color: #fff; font-size: 11px; font-weight: 800;
    display: grid; place-items: center; font-variant-numeric: tabular-nums;
    box-shadow: 0 0 0 2px rgba(10,6,18,.9), 0 0 10px rgba(239,68,68,.6);
  }
  .notif-panel {
    position: fixed; top: 66px; right: 20px; width: 320px; z-index: 80;
    border-radius: 14px; background: rgba(18,13,30,.95); border: 1px solid rgba(192,132,252,.3);
    box-shadow: 0 0 0 1px rgba(192,132,252,.08), 0 20px 50px rgba(0,0,0,.5);
    backdrop-filter: blur(10px); overflow: hidden; display: none;
  }
  .notif-panel.open { display: block; animation: npIn .25s cubic-bezier(.22,1,.36,1); }
  @keyframes npIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  .np-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 16px; font-size: 14px; font-weight: 800; color: #f3eefc;
    border-bottom: 1px solid rgba(192,132,252,.14);
  }
  .np-all {
    background: none; border: 0; cursor: pointer; font-size: 12px; color: var(--cyan);
    padding: 4px 8px; border-radius: 999px; transition: background .2s;
  }
  .np-all:hover { background: rgba(34,211,238,.1); }
  .np-item {
    display: flex; gap: 11px; align-items: flex-start; padding: 12px 16px;
    border-bottom: 1px solid rgba(192,132,252,.08); transition: background .2s; cursor: default;
  }
  .np-item:hover { background: rgba(192,132,252,.06); }
  .np-ico {
    width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0; display: grid; place-items: center;
    color: #fb7185; background: rgba(251,113,133,.12);
  }
  .np-item:nth-child(3) .np-ico { color: var(--cyan); background: rgba(34,211,238,.1); }
  .np-txt { font-size: 13px; color: #d7ccef; line-height: 1.5; }
  .np-txt b { color: #f3eefc; }
  .np-time { display: block; margin-top: 3px; font-size: 11.5px; color: #6f6391; }
  .np-empty { padding: 30px 16px; text-align: center; color: #6f6391; font-size: 13px; }
  .fade-in { animation: fadeIn .4s cubic-bezier(.22,1,.36,1) both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  @media (max-width: 860px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<nav>
  <div class="logo" onclick="toast('预览页 · 点击跳转在正式版生效')">
    <span class="mark">GR</span>
    <b>游戏对局记录<small>GAME RECORD CENTER</small></b>
  </div>
  <div class="nav-links">
    <a onclick="toast('预览页 · 全部对局')">全部对局</a>
    <a class="on" onclick="toast('当前为收藏夹效果')">我的收藏</a>
    <a onclick="toast('预览页 · 上传对局')">上传对局</a>
    <button class="bell" onclick="toggleNotif(event)" title="消息通知">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="bell-badge" id="bellBadge">2</span>
    </button>
  </div>
</nav>

<div class="notif-panel" id="notifPanel">
  <div class="np-head">
    <span>消息通知</span>
    <button class="np-all" onclick="markAllRead()">全部已读</button>
  </div>
  <div class="np-item">
    <span class="np-ico"><svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21.2l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg></span>
    <div class="np-txt"><b>夜刃</b> 点赞了你的对局《三角洲行动》<span class="np-time">3 分钟前</span></div>
  </div>
  <div class="np-item">
    <span class="np-ico"><svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></span>
    <div class="np-txt"><b>幻影枪神</b> 评论了你的对局《英雄联盟 · 大乱斗》<span class="np-time">18 分钟前</span></div>
  </div>
  <div class="np-empty" id="npEmpty" style="display:none">暂无未读通知</div>
</div>

<header class="page-head">
  <div class="kicker">SAVED PLAYS</div>
  <h1>收藏夹</h1>
  <p>把名场面收进你的宝库，星标一下，随时回看</p>
</header>

<div class="wrap">
  <div class="seg">
    <button class="on" id="btnAll">全部对局<span class="cnt" id="cntAll"></span></button>
    <button id="btnFav">我的收藏<span class="cnt" id="cntFav"></span></button>
  </div>
  <div class="grid" id="grid"></div>

  <footer>
    <div>© 2026 游戏对局记录 · 效果预览</div>
    <span class="demo-tip">星标收藏为本地演示 · 正式版接入数据库持久化</span>
  </footer>
</div>

<div id="toast"></div>

<script>
  /* ===== 示例对局数据 ===== */
  const RECORDS = [
    { id: 1, name: "三角洲行动 · 烽火地带", tags: ["翻盘", "五杀"], likes: 128, author: "夜刃", av: "linear-gradient(135deg,#fbbf24,#f97316)", result: "胜利", fav: true },
    { id: 2, name: "英雄联盟 · 大乱斗", tags: ["极限守家"], likes: 86, author: "幻影枪神", av: "linear-gradient(135deg,#c084fc,#8b5cf6)", result: "胜利", fav: true },
    { id: 3, name: "CS2 · 竞技排位", tags: ["残局1v3"], likes: 64, author: "峡谷之光", av: "linear-gradient(135deg,#22d3ee,#0ea5a4)", result: "胜利", fav: false },
    { id: 4, name: "无畏契约 · 极地寒港", tags: ["ACE"], likes: 52, author: "残月孤星", av: "linear-gradient(135deg,#60a5fa,#3b82f6)", result: "败北", fav: false },
    { id: 5, name: "永劫无间 · 天人城", tags: ["三连击"], likes: 41, author: "雨天打野", av: "linear-gradient(135deg,#f472b6,#db2777)", result: "胜利", fav: false },
    { id: 6, name: "三角洲行动 · 零号大坝", tags: ["单人Carry"], likes: 33, author: "热血上单", av: "linear-gradient(135deg,#34d399,#059669)", result: "胜利", fav: false },
    { id: 7, name: "英雄联盟 · 排位赛", tags: ["翻盘"], likes: 28, author: "冷静辅助", av: "linear-gradient(135deg,#a78bfa,#7c3aed)", result: "败北", fav: false },
    { id: 8, name: "CS2 · 死斗模式", tags: ["爆头秀"], likes: 21, author: "关键先生", av: "linear-gradient(135deg,#38bdf8,#0284c7)", result: "胜利", fav: false }
  ];

  let view = "all"; // all / fav

  function cardHtml(r, delay) {
    const resCls = r.result === "胜利" ? "" : "lose";
    return `
    <div class="card fade-in" style="animation-delay:${delay}ms" onclick="toast('预览页 · 打开对局详情')">
      <div class="cover">
        <span class="ph">对局封面</span>
        <span class="res ${resCls}">${r.result}</span>
        <button class="star ${r.fav ? "on" : ""}" data-id="${r.id}" onclick="event.stopPropagation();toggleFav(${r.id})" title="${r.fav ? "取消收藏" : "收藏"}">
          <svg viewBox="0 0 24 24"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.5l-5.8 3 1.1-6.5L2.6 9.4l6.5-.9z"/></svg>
        </button>
      </div>
      <div class="body">
        <div class="name">${r.name}</div>
        <div class="tags">${r.tags.map(t => `<i>#${t}</i>`).join("")}</div>
        <div class="meta">
          <span class="author"><span class="av" style="background:${r.av}">${r.author[0]}</span>${r.author}</span>
          <span class="likes">&#x2605; ${r.likes}</span>
        </div>
      </div>
    </div>`;
  }

  function render() {
    const list = view === "all" ? RECORDS : RECORDS.filter(r => r.fav);
    document.getElementById("cntAll").textContent = RECORDS.length;
    document.getElementById("cntFav").textContent = RECORDS.filter(r => r.fav).length;
    document.getElementById("btnAll").classList.toggle("on", view === "all");
    document.getElementById("btnFav").classList.toggle("on", view === "fav");
    if (list.length === 0) {
      document.getElementById("grid").innerHTML = `
        <div class="empty"><b>还没有收藏的对局</b><span>在对局卡片右上角点一下星标，名场面就会收进这里</span></div>`;
      return;
    }
    document.getElementById("grid").innerHTML = list.map((r, i) => cardHtml(r, Math.min(i * 40, 200))).join("");
  }

  function toggleFav(id) {
    const r = RECORDS.find(x => x.id === id);
    if (!r) return;
    r.fav = !r.fav;
    toast(r.fav ? "已收藏到我的收藏" : "已取消收藏");
    render();
  }

  document.getElementById("btnAll").addEventListener("click", () => { view = "all"; render(); });
  document.getElementById("btnFav").addEventListener("click", () => { view = "fav"; render(); });

  /* 通知铃铛：开关面板 / 全部已读 */
  function toggleNotif(e) {
    e.stopPropagation()
    document.getElementById("notifPanel").classList.toggle("open")
  }
  function markAllRead() {
    document.querySelectorAll(".notif-panel .np-item").forEach(n => (n.style.display = "none"))
    document.getElementById("bellBadge").style.display = "none"
    document.getElementById("npEmpty").style.display = "block"
    toast("已全部标记为已读")
  }
  document.addEventListener("click", () => document.getElementById("notifPanel").classList.remove("open"))

  function toast(msg) {
    let t = document.getElementById("toast");
    if (!t) { t = document.createElement("div"); t.id = "toast"; document.body.appendChild(t); }
    t.textContent = msg;
    t.style.cssText = "position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:rgba(21,16,34,.92);color:#f3eefc;border:1px solid rgba(192,132,252,.4);padding:10px 18px;border-radius:999px;font-size:13px;z-index:99;box-shadow:0 0 24px rgba(192,132,252,.3)";
    clearTimeout(t._tm);
    t._tm = setTimeout(() => (t.style.display = "none"), 1600);
    t.style.display = "block";
  }

  render();
</script>
</body>
</html>
